<!DOCTYPE html>
<html lang="bg" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Честит 11-ти рожден ден! 💙</title>
<meta name="description" content="Честит 11-ти рожден ден! Докосни ледените късчета и отвори пожеланията ✨">
<meta property="og:type" content="website">
<meta property="og:locale" content="bg_BG">
<meta property="og:site_name" content="Честит рожден ден!">
<meta property="og:title" content="Честит 11-ти рожден ден, мой скъп племеннико! 💙">
<meta property="og:description" content="Докосни ледените късчета и отвори пожеланията ✨ С много обич — леля и family">
<!-- ЗАМЕНИ USERNAME и REPO (3 места: og:url, og:image, twitter:image) -->
<meta property="og:url" content="https://USERNAME.github.io/REPO/">
<meta property="og:image" content="https://USERNAME.github.io/REPO/og-image.jpg">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Колаж с рожденика за 11-ия му рожден ден">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Честит 11-ти рожден ден! 💙">
<meta name="twitter:description" content="Докосни ледените късчета и отвори пожеланията ✨">
<meta name="twitter:image" content="https://USERNAME.github.io/REPO/og-image.jpg">
<style>
:root{--c1:#ff9ec7;--c2:#ffd86b;--c3:#7be0c3;--c4:#7ab8ff;--c5:#c3a1ff;--ink:#10285e;--panel:rgba(255,255,255,.55);--edge:rgba(255,255,255,.85)}
[data-theme=dark]{--c1:#3b1d6e;--c2:#0b3a6b;--c3:#0f5b63;--c4:#26307d;--c5:#5a1f5e;--ink:#eaf2ff;--panel:rgba(20,30,70,.55);--edge:rgba(160,200,255,.6)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;font-family:"Trebuchet MS",system-ui,sans-serif;color:var(--ink)}
body{background:linear-gradient(125deg,var(--c1),var(--c2),var(--c3),var(--c4),var(--c5),var(--c1));background-size:500% 500%;animation:bg 20s ease infinite}
@keyframes bg{0%,100%{background-position:0 50%}50%{background-position:100% 50%}}
h1{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);left:0;right:0;margin:0;text-align:center;font-size:clamp(24px,5vw,50px);z-index:5;pointer-events:none;text-shadow:0 2px 14px rgba(255,255,255,.6)}
h1 small{display:block;font-size:.38em;font-weight:400;opacity:.85;margin-top:4px}
.tile{position:absolute;left:0;top:0;cursor:pointer;will-change:transform;filter:drop-shadow(0 8px 14px rgba(20,60,140,.35));z-index:2}
.ice{background-image:url(collage.jpg);background-repeat:no-repeat;position:relative;border-radius:6px}
.tile .ice::after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.55),rgba(255,255,255,0) 40%,rgba(180,225,255,.25) 100%);mix-blend-mode:screen;pointer-events:none}
.tile:hover{filter:drop-shadow(0 0 18px #fff) brightness(1.1);z-index:3}
.bar{position:fixed;z-index:20;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.top{top:calc(env(safe-area-inset-top,0px) + 10px);right:10px}
.share{bottom:calc(env(safe-area-inset-bottom,0px) + 10px);left:8px;right:8px}
button,.btn{font:inherit;font-size:14px;border:1px solid var(--edge);background:var(--panel);color:var(--ink);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:999px;padding:9px 14px;cursor:pointer;text-decoration:none;transition:transform .2s}
button:hover,.btn:hover{transform:translateY(-2px) scale(1.05)}
.top button{width:44px;height:44px;padding:0;font-size:20px}
#intro{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:rgba(10,30,80,.55);backdrop-filter:blur(10px);color:#fff;text-align:center;padding:20px}
#intro h2{font-size:clamp(30px,7vw,64px);margin:0}
#intro button{font-size:20px;padding:14px 30px;color:#10285e;background:#fff}
.modal{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:rgba(10,25,70,.45);backdrop-filter:blur(6px);perspective:1400px;animation:fade .4s}
@keyframes fade{from{opacity:0}}
.card{position:relative;transform-style:preserve-3d;transition:transform 1.5s cubic-bezier(.2,.8,.2,1);cursor:pointer}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:14px;border:3px solid var(--edge);box-shadow:0 0 50px rgba(150,210,255,.8)}
.front::after{content:"";position:absolute;inset:0;border-radius:12px;background:linear-gradient(135deg,rgba(255,255,255,.45),transparent 45%)}
.back{transform:rotateY(180deg);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:22px;font-size:clamp(18px,3.2vw,26px);line-height:1.45;background:linear-gradient(145deg,rgba(255,255,255,.92),rgba(190,225,255,.9));color:#10285e}
[data-theme=dark] .back{background:linear-gradient(145deg,rgba(30,45,110,.95),rgba(70,40,120,.92));color:#eaf2ff}
.back i{display:block;font-size:.6em;opacity:.7;margin-top:14px;font-style:normal}
.x{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:12px;z-index:40;width:44px;height:44px;padding:0;font-size:20px}
#fx{position:fixed;inset:0;z-index:45;pointer-events:none}
</style>
</head>
<body>
<h1>Честит 11-ти рожден ден! 💙<small>Докосни ледените късчета ✨</small></h1>
<div class="bar top"><button id="snd" title="Звук">🔊</button><button id="thm" title="Тъмна / светла тема">🌙</button></div>
<div class="bar share" id="share"></div>
<canvas id="fx"></canvas>
<div id="intro"><h2>🎂 Честит рожден ден! 🎈</h2><p>Специален подарък от леля и family</p><button id="go">Започни ✨</button></div>

<script>
const IW=1024,IH=1536;
const T=[
 {r:[90,30,440,330],t:"Честит 11-ти рожден ден! Пожелавам ти да бъдеш винаги здрав, щастлив и усмихнат! 😊"},
 {r:[15,385,350,480],t:"Нека всеки твой ден бъде изпълнен с много забавления, приятели, приключения и незабравими моменти. 🎮"},
 {r:[370,385,320,520],t:"Следвай мечтите си, вярвай в себе си и никога не спирай! 🚀"},
 {r:[655,600,305,380],t:"Пожелавам ти много успехи, късмет и безброй поводи за гордост. 🏆"},
 {r:[230,900,540,630],t:"Бъди винаги такова страхотно момче, каквото си! Много здраве, щастие и още много незабравими приключения! 💙"},
 {r:[0,1080,290,340],t:"Добър, умен, забавен, специален, смел, талантлив, невероятен — това си ти! 🎂"},
 {r:[530,30,480,290],t:"Моят скъп племеннико, честит рожден ден! С много обич — леля и family 💙"},
 {r:[740,1000,245,330],t:"Нека мечтите ти летят високо като балоните! 🎈"}
];
const $=s=>document.querySelector(s);
const root=document.documentElement;
function paint(el,r,W){const s=W/r[2];el.style.width=W+"px";el.style.height=r[3]*s+"px";el.style.backgroundSize=IW*s+"px "+IH*s+"px";el.style.backgroundPosition=-r[0]*s+"px "+-r[1]*s+"px"}

/* ---------- Звук (Web Audio) ---------- */
let AC,master,on=true,timer;
const P=[0,2,4,7,9,12,14,16,19];
const base=261.63, f=n=>base*Math.pow(2,n/12);
function note(fr,t,d,type="sine",v=.12,dest){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=fr;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.03);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(dest||master);o.start(t);o.stop(t+d+.05)}
const chords=[[0,4,7],[-3,0,4],[-7,-3,0],[-5,-1,2]];
let ci=0;
function music(){if(!AC||!on)return;const t=AC.currentTime;
 chords[ci%4].forEach(n=>note(f(n-12),t,3.8,"triangle",.05));ci++;
 for(let i=0;i<6;i++)note(f(P[Math.floor(Math.random()*P.length)]),t+i*.6+Math.random()*.15,1.6,"sine",.07)}
function chime(up=true){if(!AC||!on)return;const t=AC.currentTime;[0,4,7,12,16].forEach((n,i)=>note(f(up?n+12:n+12-i*2),t+i*.07,.9,"sine",.1))}
function startAudio(){if(AC)return;AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.9;master.connect(AC.destination);music();timer=setInterval(music,3800)}
$("#snd").onclick=()=>{on=!on;$("#snd").textContent=on?"🔊":"🔇";if(master)master.gain.value=on?.9:0};

/* ---------- Тема ---------- */
$("#thm").onclick=()=>{const d=root.dataset.theme==="dark";root.dataset.theme=d?"light":"dark";$("#thm").textContent=d?"🌙":"☀️"};

/* ---------- Плаващи ледени късчета ---------- */
const tiles=[];
function build(){
 tiles.forEach(t=>t.el.remove());tiles.length=0;
 const bw=Math.max(110,Math.min(190,innerWidth*.26));
 T.forEach((d,i)=>{
  const el=document.createElement("div");el.className="tile";
  const ice=document.createElement("div");ice.className="ice";paint(ice,d.r,bw*(0.85+Math.random()*.35));
  const j=()=>Math.round(Math.random()*9);
  ice.style.clipPath=`polygon(${j()}% ${j()}%,${50+j()-5}% 0,${100-j()}% ${j()}%,100% ${50+j()-5}%,${100-j()}% ${100-j()}%,${50+j()-5}% 100%,${j()}% ${100-j()}%,0 ${50+j()-5}%)`;
  el.appendChild(ice);document.body.appendChild(el);
  const o={el,d,x:Math.random()*(innerWidth-bw),y:90+Math.random()*(innerHeight-bw-200),vx:(Math.random()-.5)*.7,vy:(Math.random()-.5)*.7,a:Math.random()*360,va:(Math.random()-.5)*.25,ph:Math.random()*6,w:ice.offsetWidth,h:ice.offsetHeight};
  el.onclick=()=>{startAudio();openCard(o)};
  tiles.push(o)})}
function loop(t){
 tiles.forEach(o=>{
  o.x+=o.vx;o.y+=o.vy;o.a+=o.va;
  if(o.x<0||o.x>innerWidth-o.w)o.vx*=-1;
  if(o.y<70||o.y>innerHeight-o.h-70)o.vy*=-1;
  const b=Math.sin(t/900+o.ph);
  o.el.style.transform=`translate3d(${o.x}px,${o.y+b*8}px,0) rotate(${o.a%360+b*4}deg)`});
 requestAnimationFrame(loop)}

/* ---------- Отваряне със завъртане 180° / 360° ---------- */
function openCard(o){
 chime();
 const r=o.d.r,asp=r[3]/r[2];
 const W=Math.min(innerWidth*.88,460,innerHeight*.72/asp),H=W*asp;
 const m=document.createElement("div");m.className="modal";
 const c=document.createElement("div");c.className="card";c.style.width=W+"px";c.style.height=H+"px";
 c.innerHTML='<div class="face front ice"></div><div class="face back"><div>'+o.d.t+'</div><i>Докосни, за да обърнеш ↻</i></div>';
 paint(c.querySelector(".front"),r,W);
 const x=document.createElement("button");x.className="x";x.textContent="✕";
 c.style.transition="none";c.style.transform="scale(.1) rotateY(-180deg)";
 m.appendChild(c);m.appendChild(x);document.body.appendChild(m);
 void c.offsetWidth;c.style.transition="";c.style.transform="scale(1) rotateY(180deg)"; /* -180 → 180 = пълен оборот 360° */
 setTimeout(()=>confetti(),900);
 let side=180;
 c.onclick=e=>{e.stopPropagation();side=side===180?360:180;c.style.transform=`scale(1) rotateY(${side}deg)`;chime(side===180)};
 const close=()=>{c.style.transform="scale(.05) rotateY(-360deg)";m.style.opacity=0;m.style.transition="opacity .5s";setTimeout(()=>m.remove(),500)};
 x.onclick=close;m.onclick=e=>{if(e.target===m)close()}}

/* ---------- Конфети ---------- */
const cv=$("#fx"),cx=cv.getContext("2d");let ps=[],run=false;
function size(){cv.width=innerWidth;cv.height=innerHeight}
function confetti(){for(let i=0;i<140;i++)ps.push({x:innerWidth/2,y:innerHeight/2,vx:(Math.random()-.5)*16,vy:-Math.random()*14-3,s:4+Math.random()*7,c:`hsl(${Math.random()*360},90%,60%)`,r:Math.random()*6});if(!run){run=true;draw()}}
function draw(){cx.clearRect(0,0,cv.width,cv.height);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.35;p.r+=.2;cx.fillStyle=p.c;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);cx.restore()});ps=ps.filter(p=>p.y<cv.height+20);if(ps.length)requestAnimationFrame(draw);else{run=false;cx.clearRect(0,0,cv.width,cv.height)}}

/* ---------- Споделяне ---------- */
const U=()=>encodeURIComponent(location.href.split("#")[0]);
const TX=encodeURIComponent("Честит 11-ти рожден ден! 💙 Отвори ледените пожелания:");
const L=[
 ["Facebook",()=>`https://www.facebook.com/sharer/sharer.php?u=${U()}`],
 ["Messenger",()=>`fb-messenger://share/?link=${U()}`],
 ["WhatsApp",()=>`https://wa.me/?text=${TX}%20${U()}`],
 ["Viber",()=>`viber://forward?text=${TX}%20${U()}`],
 ["Telegram",()=>`https://t.me/share/url?url=${U()}&text=${TX}`],
 ["X",()=>`https://twitter.com/intent/tweet?text=${TX}&url=${U()}`]
];
const sh=$("#share");
L.forEach(([n,fn])=>{const a=document.createElement("a");a.className="btn";a.textContent=n;a.target="_blank";a.rel="noopener";a.onclick=e=>{e.preventDefault();window.open(fn(),"_blank")};a.href="#";sh.appendChild(a)});
function btn(txt,fn){const b=document.createElement("button");b.textContent=txt;b.onclick=fn;sh.appendChild(b)}
btn("📷 Сподели със снимка",async()=>{
 try{const bl=await (await fetch("collage.jpg")).blob();const file=new File([bl],"rozhden-den-11.jpg",{type:"image/jpeg"});
  if(navigator.canShare&&navigator.canShare({files:[file]}))return await navigator.share({files:[file],title:"Честит рожден ден!",text:decodeURIComponent(TX),url:location.href});
  if(navigator.share)return await navigator.share({title:"Честит рожден ден!",text:decodeURIComponent(TX),url:location.href});
 }catch(e){if(e.name==="AbortError")return}
 window.open(`https://www.facebook.com/sharer/sharer.php?u=${U()}`,"_blank")});
btn("⬇️ Снимка",()=>{const a=document.createElement("a");a.href="collage.jpg";a.download="rozhden-den-11.jpg";a.click()});
btn("🔗 Копирай",async()=>{try{await navigator.clipboard.writeText(location.href);alert("Линкът е копиран! 💙")}catch(e){prompt("Копирай линка:",location.href)}});

/* ---------- Старт ---------- */
$("#go").onclick=()=>{startAudio();chime();$("#intro").style.transition="opacity .6s";$("#intro").style.opacity=0;setTimeout(()=>{$("#intro").remove();confetti()},600)};
addEventListener("resize",()=>{size()});
size();build();requestAnimationFrame(loop);
</script>
</body>
</html>
